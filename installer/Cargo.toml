[package]
name = "installer"
version = "0.5.0"
edition = "2024"
description = "The installer: knows the computer, installs from an answers file, serves the graphical installer"
license = "MIT"
publish = false

# The binary is installed under the distro's name by installer/package.nix.
[[bin]]
name = "installer"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
