# Chamber: Aperture-style test chambers, white cards with black sign plates.
# The colors are the tokens of the design system "Chamber UI", version 5,
# under their names there. The ten required colors point at the matching
# token; every token is also available under its own name for Quickshell.
#
# Chamber UI has no terminal palette yet. The terminal background and text
# come from its "terminal" token; red, yellow and blue from its signal
# colors; green, magenta, cyan and the bright yellow are chosen to sit with
# them and will change when the design system defines them.
format = 1
name = "Chamber"
description = "White cards with black sign plates, like a test chamber."
default-variant = "light"

[variants.light]
name = "Lights on"
appearance = "light"

[variants.light.colors]
background = "#f2f3f5"  # ground
surface = "#ffffff"  # card
border = "#dde0e4"  # line
text = "#16181b"  # ink
text-muted = "#5b6168"  # ink-sub
accent = "#ff9419"  # orange
on-accent = "#16181b"  # on-signal
focus = "#0f8fd6"  # focus
error = "#d93a2f"  # red-text
warning = "#f2c230"  # yellow
# Every token of Chamber UI under its own name
ground = "#f2f3f5"
ground-joint = "#e2e5e8"
card = "#ffffff"
hover = "#f2f3f5"
field = "#f2f3f5"
line = "#dde0e4"
inactive = "#c8ccd1"
muted = "#9aa0a7"
mark = "#c8ccd1"
wall = "#c9ced4"
wall-panel = "#eceef1"
wall-panel-dark = "#8d949c"
wall-floor = "#4f555c"
ink = "#16181b"
ink-sub = "#5b6168"
sign = "#16181b"
sign-hover = "#2a2d32"
on-sign = "#ffffff"
sign-sub = "#c8ccd1"
sign-accent = "#36c0f1"
sign-off = "#5b6168"
sign-dim = "#3a3e44"
place = "#0b6fa8"
on-place = "#ffffff"
light-blue = "#36c0f1"
orange = "#ff9419"
orange-line = "#d86a00"
yellow = "#f2c230"
red = "#d93a2f"
red-text = "#d93a2f"
on-signal = "#16181b"
on-red = "#ffffff"
terminal = "#2a2d32"
dim = "#16181b4c"
dim-strong = "#16181b8c"

