# Creates the GitHub release for every pushed version tag (v1.2.3).
# The notes come from cliff.toml, so they look exactly like CHANGELOG.md.
#
# Then builds the ISO, signs it for Secure Boot and attaches it (in parts
# below 2 GiB if it is larger) with SHA256SUMS. Only
# after that, stable moves to the tag, so installed machines never see a
# release without an ISO.
#
# Run by hand (Actions, "Release", "Run workflow") it is a dry run: it builds
# and packages the ISO from the chosen branch and attaches the files to the
# run as an artifact, without a release and without moving stable.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Drop the version heading (the release title shows it)
        run: sed -i '0,/^## /{/^## /d}' RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md

  iso:
    needs: release
    # Also when release was skipped (dry run)
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The runner has about 14 GB free, the ISO build needs more
      - uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false

      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Version
        id: version
        run: |
          version=$(nix eval --raw .#lib.version)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "id=$(nix eval --raw --file branding.nix id)" >> "$GITHUB_OUTPUT"

      - name: Tag and flake version must match
        if: github.event_name == 'push'
        run: test "${{ steps.version.outputs.tag }}" = "$GITHUB_REF_NAME"

      - name: Build the ISO
        run: nix build -L .#iso

      # Second line of defence behind checks.iso-clean: also catches a package
      # that pulls the guest tools in some other way
      - name: No VM guest tools in the ISO
        run: |
          id=${{ steps.version.outputs.id }}
          if nix path-info -r \
               ".#nixosConfigurations.$id-iso.config.system.build.toplevel" \
               ".#nixosConfigurations.$id-reference.config.system.build.toplevel" \
             | grep -E 'open-vm-tools|virtualbox'; then
            echo "VM guest tools found in the ISO closure" >&2
            exit 1
          fi

      # A release is always signed for Secure Boot (secure-boot/README.md).
      # The dry run by hand also works without the key, with a warning.
      - name: Sign the ISO
        id: sign
        env:
          KEY_PEM: ${{ secrets.SECURE_BOOT_KEY }}
          REQUIRE_SIGNATURE: ${{ github.event_name == 'push' }}
        run: ./.github/scripts/sign-iso.sh result/iso/*.iso signed

      - name: Split and checksum
        run: ./.github/scripts/package-iso.sh "${{ steps.sign.outputs.iso }}" out/

      - name: Attach to the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: out/*

      - name: Keep the files (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: out/
          retention-days: 7

      # Installed machines follow stable. The tag is normally ahead of stable,
      # force only matters if stable was ever moved by hand. GITHUB_TOKEN may
      # not move a branch to a commit that changes workflow files, so this
      # step needs STABLE_PUSH_TOKEN: a fine-grained token for this repository
      # with Contents and Workflows "Read and write".
      - name: Move stable to this release
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.STABLE_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::No secret STABLE_PUSH_TOKEN: the release is out, but stable still points at the last one. Move it by hand: git push --force origin $GITHUB_SHA:refs/heads/stable"
            exit 1
          fi
          # Without the header of actions/checkout, which would send GITHUB_TOKEN instead
          git -c http.https://github.com/.extraheader= push --force \
            "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/stable"
