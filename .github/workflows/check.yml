# On every push and pull request: the fast checks (L0). Every machine, the ISO
# and the installer functions evaluate, plus the assertions in tests/eval.nix.
#
# On every push to main, once the checks pass: build the ISO (iso-dev, the
# faster compression) and attach it to the run as a download. Find it under
# Actions, the run, "Artifacts". The ISO comes from a clean checkout with
# flake.lock, so machines installed from it are pinned to that commit.
#
# On every push to main and m245-poc: the cache job builds the distro's own
# packages and the reference system and pushes them to the binary cache
# (modules/cache.nix), so installed machines download them instead of
# compiling. It needs the secret CACHIX_AUTH_TOKEN and does nothing without it.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix flake check
        run: nix flake check -L --show-trace

  cache:
    needs: flake
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/m245-poc')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      # The reference system with the desktop does not fit into the 14 GB
      - if: env.CACHIX_AUTH_TOKEN != ''
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false

      - uses: actions/checkout@v7

      - id: nix
        uses: ./.github/actions/nix
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # cache-roots (flake.nix) holds what an update would otherwise compile.
      # cachix push takes the whole closure and skips everything that is
      # already on cache.nixos.org.
      - name: Build and push
        if: steps.nix.outputs.cache != ''
        run: |
          nix build --no-link --print-out-paths -L .#cache-roots > paths.txt
          cachix push "${{ steps.nix.outputs.cache }}" < paths.txt

  iso:
    needs: [flake, cache]
    # After the cache job, so the own packages come from the cache
    if: >-
      !cancelled() && needs.flake.result == 'success' && needs.cache.result != 'failure' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The runner has about 14 GB free, the ISO build needs more. Removing
      # these toolchains takes seconds and frees about 30 GB.
      - uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false

      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the ISO
        run: nix build .#iso-dev -L

      # Secure Boot: shim in front, GRUB and the kernel signed with the key
      # from the secret SECURE_BOOT_KEY (secure-boot/README.md). Without the
      # secret or the certificate the dev ISO stays unsigned and only boots
      # with Secure Boot off.
      - name: Sign the ISO
        id: sign
        env:
          KEY_PEM: ${{ secrets.SECURE_BOOT_KEY }}
        run: ./.github/scripts/sign-iso.sh result/iso/*.iso signed

      - name: Name the file after the commit
        id: name
        run: |
          src=${{ steps.sign.outputs.iso }}
          base=$(basename "$src" .iso)
          name="$base-${GITHUB_SHA::7}"
          mkdir out
          if [[ $src == signed/* ]]; then mv "$src" "out/$name.iso"; else cp "$src" "out/$name.iso"; fi
          (cd out && sha256sum "$name.iso" > "$name.iso.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: out/
          retention-days: 14
          # The ISO is already compressed
          compression-level: 0
          if-no-files-found: error
