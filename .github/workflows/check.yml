# The proof of concept for M245 (branch m245-poc).
#
# On every push and pull request: the fast checks (L0). Every machine, the ISO
# and the installer functions evaluate, plus the assertions in tests/eval.nix.
#
# On every push to m245-poc: the cache job pushes the own packages and the
# reference system to the binary cache (modules/cache.nix), then the ISO is
# built, signed for Secure Boot and published as the pre-release poc with
# manifest.json, where the bootstick app downloads it. Releases (vX.Y.Z) only
# come from main.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: nix flake check
        run: nix flake check -L --show-trace

  cache:
    needs: flake
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/m245-poc'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      # The reference system with the desktop does not fit into the 14 GB
      - if: env.CACHIX_AUTH_TOKEN != ''
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false

      - uses: actions/checkout@v7

      - id: nix
        uses: ./.github/actions/nix
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # cache-roots (flake.nix) holds what an update would otherwise compile.
      # cachix push takes the whole closure and skips everything that is
      # already on cache.nixos.org.
      - name: Build and push
        if: steps.nix.outputs.cache != ''
        run: |
          nix build --no-link --print-out-paths -L .#cache-roots > paths.txt
          cachix push "${{ steps.nix.outputs.cache }}" < paths.txt

  iso:
    needs: [flake, cache]
    # After the cache job, so the own packages come from the cache
    if: >-
      !cancelled() && needs.flake.result == 'success' && needs.cache.result != 'failure' &&
      github.ref == 'refs/heads/m245-poc' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Replaces the pre-release poc
    permissions:
      contents: write
    steps:
      # The runner has about 14 GB free, the ISO build needs more. Removing
      # these toolchains takes seconds and frees about 30 GB.
      - uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false

      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the ISO
        run: nix build .#iso -L

      # Secure Boot: shim in front, GRUB and the kernel signed with the key
      # from the secret SECURE_BOOT_KEY (secure-boot/README.md). The bootstick
      # app promises Secure Boot can stay on, so an unsigned ISO is an error.
      - name: Sign the ISO
        id: sign
        env:
          KEY_PEM: ${{ secrets.SECURE_BOOT_KEY }}
          REQUIRE_SIGNATURE: true
        run: ./.github/scripts/sign-iso.sh result/iso/*.iso signed

      - name: Split, checksum, manifest
        env:
          SECURE_BOOT_SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          version=$(nix eval --raw .#lib.version)
          DISTRO_NAME=$(nix eval --raw --file branding.nix name)
          export DISTRO_NAME
          ./.github/scripts/package-iso.sh "v$version" "${{ steps.sign.outputs.iso }}" out/

      # The bootstick app reads releases/download/poc/manifest.json. The old
      # pre-release goes first, so the tag moves to this commit and no file
      # of an older ISO stays behind.
      - name: Replace the pre-release poc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete poc --yes --cleanup-tag || true
          gh release create poc out/* \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "$(nix eval --raw --file branding.nix name), proof of concept (M245)" \
            --notes "The ISO of the branch m245-poc at ${GITHUB_SHA::7}, signed for Secure Boot. The bootstick app writes it to a stick; the releases of the distribution are the vX.Y.Z ones."
