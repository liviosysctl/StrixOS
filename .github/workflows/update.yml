# Every week and on demand: move everything to the newest versions, on main
# and on personal.
#
#   nix flake update                      nixpkgs, disko, StrixUI (the design system
#                                         and the god themes) and the other inputs
#   cargo update (packages/theme-engine)  the crates of the theme engine
#   cargo update (packages/search)        the crates of the search service
#
# The update is committed locally first (the install test needs a committed
# tree for the machine lock), then nix flake check and the install test run.
# Only when both pass is the commit pushed. A red run leaves the branch as it
# was; the log shows what broke.
#
# Commits are made in Livio's name, like every other commit in this repository.
name: Update

on:
  schedule:
    # Mondays 03:41 UTC, after the nightly install test
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        branch: [main, personal]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false

      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - uses: ./.github/actions/nix
        with:
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extra-nix-config: system-features = nixos-test benchmark big-parallel kvm

      - name: Newest Rust for the crate update
        run: rustup update stable && rustup default stable

      - name: Update
        id: update
        run: |
          git config user.name "Liviosysctl"
          git config user.email "livio.deganutti@pm.me"
          nix flake update 2>&1 | tee update.log
          (cd packages/theme-engine && cargo update 2>&1) | tee -a update.log
          (cd packages/search && cargo update 2>&1) | tee -a update.log
          if git diff --quiet; then
            echo "Everything is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "build(nix): update flake inputs and crates"
            echo
            grep -E "Updated input|→|Updating|Adding|Removing" update.log | sed 's/^/    /' || true
          } > message.txt
          git commit -a -F message.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: nix flake check
        if: steps.update.outputs.changed == 'true'
        run: nix flake check -L

      - name: Install test
        if: steps.update.outputs.changed == 'true'
        run: nix build .#tests.install -L

      - name: Push
        if: steps.update.outputs.changed == 'true'
        run: git push origin "HEAD:${{ matrix.branch }}"
