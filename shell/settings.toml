# The settings of Strix as Search sees them (10-search): every page and row of the settings
# app (shell/qml/Settings.qml) with the words people search for. `open` starts the app at a page
# or a row; `{id}` stands for the distro id, also in the commands that print a value.
open = ["{id}-settings", "{page}", "{row}"]

[[page]]
id = "themes"
title = "Themes"
symbol = "palette"
words = ["theme", "look", "god", "colours", "wallpaper", "appearance"]

[[page]]
id = "network"
title = "Network"
symbol = "wifi"
words = ["wi-fi", "wifi", "wlan", "internet", "wired", "ethernet"]

[[page]]
id = "bluetooth"
title = "Bluetooth"
symbol = "bluetooth"
words = ["headphones", "pair", "devices"]

[[page]]
id = "sound"
title = "Sound"
symbol = "volume-2"
words = ["audio", "volume", "speakers", "headphones", "microphone"]

[[page]]
id = "display"
title = "Display"
symbol = "monitor"
words = ["screen", "monitor", "scale", "resolution", "hidpi"]

[[page]]
id = "power"
title = "Power"
symbol = "zap"
words = ["battery", "energy", "lid", "suspend", "hibernate", "profile"]

[[page]]
id = "hotkeys"
title = "Hotkeys"
symbol = "keyboard"
words = ["keys", "shortcuts", "bindings", "keyboard"]

[[page]]
id = "about"
title = "About"
symbol = "info"
words = ["version", "system", "release"]

[[row]]
id = "theme"
page = "themes"
title = "Theme"
description = "The god the machine starts with, also on the boot splash"
type = "choice"
words = ["colours", "look", "god", "picker"]
value = ["{id}-theme", "current"]

[[row]]
id = "keep"
page = "themes"
title = "Keep this theme"
description = "No change to another god every 10 minutes"
type = "switch"
words = ["cycle", "rotate", "change", "interval", "keep"]

[[row]]
id = "repositories"
page = "themes"
title = "Theme repositories"
description = "Themes from outside: connect, update now, remove"
type = "action"
words = ["repository", "repo", "git", "github", "connect", "outside", "more themes"]

[[row]]
id = "wifi"
page = "network"
title = "Wi-Fi"
description = "Networks around, connect with a password"
type = "switch"
words = ["wlan", "wireless", "connect", "password"]

[[row]]
id = "output"
page = "sound"
title = "Output device"
type = "choice"
words = ["speaker", "headphones", "audio"]
value = ["sh", "-c", "wpctl inspect @DEFAULT_AUDIO_SINK@ | sed -n 's/.*node.description = \"\\(.*\\)\"/\\1/p' | head -n 1"]

[[row]]
id = "input"
page = "sound"
title = "Microphone"
type = "choice"
words = ["input", "recording", "mic"]

[[row]]
id = "scale"
page = "display"
title = "Scale"
type = "choice"
words = ["zoom", "size", "hidpi", "bigger", "smaller"]

[[row]]
id = "profile"
page = "power"
title = "Power profile"
type = "choice"
words = ["power saver", "balanced", "performance", "energy"]
value = ["powerprofilesctl", "get"]

[[row]]
id = "lid"
page = "power"
title = "Closing the lid"
type = "text"
words = ["lid", "suspend", "sleep", "close"]
value = ["cat", "/etc/xdg/{id}/lid"]

[[row]]
id = "bluetooth"
page = "bluetooth"
title = "Bluetooth"
type = "switch"
words = ["headphones", "pair"]

[[row]]
id = "all"
page = "hotkeys"
title = "All hotkeys"
description = "Every key of Strix; click one to change it"
type = "keys"
words = ["cheat sheet", "shortcuts", "bindings"]

[[row]]
id = "version"
page = "about"
title = "Version"
type = "text"
words = ["release", "os"]
value = ["sh", "-c", ". /etc/os-release && echo \"$NAME $VERSION_ID\""]

[[row]]
id = "update"
page = "about"
title = "Update"
description = "Fetch the newest release and every theme repository"
type = "action"
words = ["upgrade", "new version"]
