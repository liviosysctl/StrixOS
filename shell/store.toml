# The catalog of the Store (packages/store/src/catalog.rs): the suggestions on its first page,
# its categories, and the names and icons of apps where nixpkgs' own name does not say them.
# nixpkgs has neither categories nor icons, so they are chosen here by hand; the search still
# finds every package. Apps are named by their attribute in nixpkgs; one the system brings along
# from elsewhere (Zen) by its package name. tests/eval.nix checks that every one exists.

# The suggestions at the top of the first page: free apps worth having. Proprietary apps are not
# in the channel's package list, so the Store cannot offer them anyway.
featured = [
  "obs-studio",
  "gimp",
  "libreoffice",
  "vlc",
  "blender",
  "thunderbird",
  "inkscape",
  "signal-desktop",
  "kdePackages.kdenlive",
]

[[category]]
id = "internet"
name = "Internet"
symbol = "globe"
about = "Browsers, mail and downloads"
apps = ["zen-beta", "firefox", "chromium", "thunderbird", "qbittorrent", "filezilla", "localsend", "newsflash"]

[[category]]
id = "chat"
name = "Chat"
symbol = "inbox"
about = "Messages, calls and meetings"
apps = ["signal-desktop", "telegram-desktop", "element-desktop", "fractal", "dino"]

[[category]]
id = "office"
name = "Office"
symbol = "file"
about = "Documents, notes and books"
apps = ["libreoffice", "onlyoffice-desktopeditors", "joplin-desktop", "xournalpp", "calibre", "foliate", "papers"]

[[category]]
id = "graphics"
name = "Graphics"
symbol = "palette"
about = "Drawing, photos and 3D"
apps = ["gimp", "inkscape", "krita", "blender", "darktable", "pinta", "freecad", "upscayl"]

[[category]]
id = "media"
name = "Music and video"
symbol = "music"
about = "Listening, watching, recording and cutting"
apps = ["vlc", "mpv", "amberol", "obs-studio", "kdePackages.kdenlive", "audacity", "handbrake", "shortwave"]

[[category]]
id = "games"
name = "Games"
symbol = "disc-3"
about = "Games and their launchers"
apps = ["heroic", "lutris", "prismlauncher", "supertuxkart", "luanti", "retroarch"]

[[category]]
id = "learning"
name = "Learning"
symbol = "book-open"
about = "For school and for finding things out"
apps = ["anki", "stellarium", "gcompris", "kstars", "kdePackages.marble"]

[[category]]
id = "development"
name = "Development"
symbol = "square-terminal"
about = "Editors, terminals and tools for code"
apps = ["zed-editor", "vscodium", "ghostty", "github-desktop", "dbeaver-bin", "bruno", "meld"]

[[category]]
id = "tools"
name = "Tools"
symbol = "sliders-horizontal"
about = "Files, passwords and the machine"
apps = ["nautilus", "btop", "mission-center", "keepassxc", "bitwarden-desktop", "gnome-disk-utility", "baobab", "file-roller"]

