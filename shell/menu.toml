words = ["variant", "light", "dark", "appearance"]
run = ["qs", "-c", "{id}", "ipc", "call", "theme", "variant", "light"]

[[action]]
id = "next-wallpaper"
title = "Next wallpaper"
group = "style"
symbol = "images"
words = ["background", "cycle"]
run = ["qs", "-c", "{id}", "ipc", "call", "theme", "next"]

[[action]]
id = "toggle-bar"
title = "Toggle the top bar"
group = "style"
symbol = "app-window"
words = ["bar", "hide", "show", "panel"]
