run = ["qs", "-c", "{id}", "ipc", "call", "bar", "toggle"]

# ------------------------------------------------------------------ Capture

[[action]]
id = "region-screenshot"
title = "Region screenshot"
group = "capture"
symbol = "crop"
words = ["screenshot", "area", "select", "snip"]
keys = "Print"
run = ["{id}-capture", "region"]

[[action]]
id = "window-screenshot"
title = "Window screenshot"
group = "capture"
symbol = "app-window"
words = ["screenshot", "window"]
keys = "Shift Print"
run = ["{id}-capture", "window"]

[[action]]
id = "screen-screenshot"
title = "Screen screenshot"
group = "capture"
symbol = "monitor"
words = ["screenshot", "full", "display"]
keys = "Ctrl Print"
run = ["{id}-capture", "screen"]

[[action]]
id = "record-region"
title = "Record a region"
group = "capture"
symbol = "video"
words = ["screencast", "recording", "video"]
keys = "Alt Print"
run = ["{id}-capture", "record"]

[[action]]
id = "colour-picker"
title = "Colour picker"
group = "capture"
symbol = "pipette"
words = ["color", "hex", "eyedropper"]
keys = "Super Print"
run = ["{id}-capture", "colour"]

# ------------------------------------------------------------------ Clipboard

[[action]]
id = "clipboard-history"
title = "History"
group = "clipboard"
symbol = "history"
words = ["clipboard", "paste", "copied"]
keys = "Super V"
run = ["qs", "-c", "{id}", "ipc", "call", "clipboard", "toggle"]

[[action]]
id = "clipboard-clear"
title = "Clear history"
group = "clipboard"
symbol = "trash-2"
words = ["clipboard", "delete", "wipe"]
run = ["qs", "-c", "{id}", "ipc", "call", "clipboard", "clear"]

# ------------------------------------------------------------------ Update

[[action]]
id = "check-updates"
title = "Check for updates"
group = "update"
symbol = "refresh-cw"
words = ["upgrade", "new", "version", "update"]
run = ["{id}-update"]
terminal = true

[[action]]
id = "rebuild"
title = "Rebuild the system"
group = "update"
symbol = "hard-drive-download"
words = ["rebuild", "switch", "nixos", "configuration"]
run = ["sudo", "{id}-rebuild", "switch"]
terminal = true

[[action]]
id = "what-changed"
title = "What changed"
group = "update"
symbol = "file"
words = ["release", "notes", "changelog"]
run = ["xdg-open", "https://github.com/liviosysctl/StrixOS/releases"]

# ------------------------------------------------------------------ System

[[action]]
id = "lock"
title = "Lock"
group = "system"
symbol = "lock"
words = ["lock", "screen"]
keys = "Super Escape"
run = ["loginctl", "lock-session"]

[[action]]
id = "log-out"
title = "Log out"
group = "system"
symbol = "log-out"
words = ["sign", "out", "session", "exit"]
run = ["hyprctl", "dispatch", "hl.dsp.exit()"]

[[action]]
id = "suspend"
title = "Suspend"
group = "system"
symbol = "moon"
words = ["sleep", "standby"]
run = ["systemctl", "suspend"]

[[action]]
id = "hibernate"
title = "Hibernate"
group = "system"
symbol = "moon-star"
words = ["sleep", "disk"]
run = ["systemctl", "hibernate"]

[[action]]
id = "restart"
title = "Restart"
group = "system"
symbol = "rotate-cw"
words = ["reboot"]
run = ["systemctl", "reboot"]

[[action]]
id = "shut-down"
title = "Shut down"
group = "system"
symbol = "power"
words = ["power", "off", "poweroff", "halt"]
run = ["systemctl", "poweroff"]

[[action]]
id = "notifications"
title = "Notifications"
group = "system"
symbol = "bell"
words = ["panel", "messages"]
keys = "Super N"
run = ["qs", "-c", "{id}", "ipc", "call", "notifications", "toggle"]

[[action]]
id = "do-not-disturb"
title = "Do not disturb"
group = "system"
symbol = "bell"
words = ["silence", "quiet", "mute", "notifications"]
keys = "Super Shift N"
run = ["qs", "-c", "{id}", "ipc", "call", "notifications", "quiet"]

# ------------------------------------------------------------------ Learn

[[action]]
id = "all-hotkeys"
title = "All hotkeys"
group = "learn"
symbol = "keyboard"
words = ["cheat", "sheet", "shortcuts", "keybindings", "keys"]
keys = "Super K"
run = ["qs", "-c", "{id}", "ipc", "call", "cheatsheet", "toggle"]

[[action]]
id = "manual"
title = "Manual"
group = "learn"
symbol = "book-open"
words = ["help", "documentation", "readme"]
run = ["xdg-open", "https://github.com/liviosysctl/StrixOS"]

# ------------------------------------------------------------------ Keys that are no action

[[binding]]
id = "search"
title = "Search"
group = "Learn"
target = "Apps, actions, settings and commands"
keys = "Super Space"
run = ["qs", "-c", "{id}", "ipc", "call", "search", "toggle"]

[[binding]]
id = "terminal"
title = "Terminal"
group = "Apps"
target = "Ghostty"
keys = "Super Return"
run = ["ghostty"]

[[binding]]
id = "browser"
title = "Browser"
group = "Apps"
target = "Firefox"
keys = "Super Shift Return"
run = ["firefox"]

[[binding]]
id = "files"
title = "Files"
group = "Apps"
target = "File manager"
keys = "Super Shift F"
run = ["nautilus", "--new-window"]

[[binding]]
id = "text-editor"
title = "Text editor"
group = "Apps"
target = "Editor"
keys = "Super Shift E"
run = ["gnome-text-editor", "--new-window"]

[[binding]]
id = "music"
title = "Music"
group = "Apps"
target = "Music player"
keys = "Super Shift M"
run = ["amberol"]

[[binding]]
id = "close-window"
title = "Close window"
group = "Windows"
target = "Window"
keys = "Super W"
hypr = "hl.dsp.window.close()"

[[binding]]
id = "full-screen"
title = "Full screen"
group = "Windows"
target = "Window"
keys = "Super F"
hypr = "hl.dsp.window.fullscreen()"

[[binding]]
id = "float-or-tile"
title = "Float or tile"
group = "Windows"
target = "Window"
keys = "Super T"
hypr = 'hl.dsp.window.float({ action = "toggle" })'

[[binding]]
id = "split-direction"
title = "Split direction"
group = "Windows"
target = "Window"
keys = "Super J"
hypr = 'hl.dsp.layout("togglesplit")'

[[binding]]
id = "move-focus"
title = "Move focus"
group = "Windows"
target = "Window"
keys = "Super Arrows"
hypr = 'hl.dsp.focus({ direction = "{key}" })'

[[binding]]
id = "swap-windows"
title = "Swap windows"
group = "Windows"
target = "Window"
keys = "Super Shift Arrows"
hypr = 'hl.dsp.window.swap({ direction = "{key}" })'

[[binding]]
id = "grow-or-shrink"
title = "Grow or shrink"
group = "Windows"
target = "Window"
keys = "Super = -"
hypr = [
  "hl.dsp.window.resize({ x = 40, y = 40, relative = true })",
  "hl.dsp.window.resize({ x = -40, y = -40, relative = true })",
]
repeat = true

[[binding]]
id = "go-to-workspace"
title = "Go to workspace"
group = "Workspaces"
target = "Workspace"
keys = "Super 1–9"
hypr = "hl.dsp.focus({ workspace = {key} })"

[[binding]]
id = "move-window-there"
title = "Move window there"
group = "Workspaces"
target = "Workspace"
keys = "Super Shift 1–9"
hypr = "hl.dsp.window.move({ workspace = {key} })"

[[binding]]
id = "next-workspace"
title = "Next workspace"
group = "Workspaces"
target = "Workspace"
keys = "Super Tab"
hypr = 'hl.dsp.focus({ workspace = "e+1" })'

[[binding]]
id = "scratchpad"
title = "Scratchpad"
group = "Workspaces"
target = "Special workspace"
keys = "Super S"
hypr = 'hl.dsp.workspace.toggle_special("scratchpad")'

# The keys of a laptop or a media keyboard. They work on the lock screen too (locked) and repeat
# while held; the OSD of the shell shows volume and brightness.

[[binding]]
id = "volume-up"
title = "Louder"
group = "Sound and light"
target = "Speakers"
keys = "VolumeUp"
run = ["wpctl", "set-volume", "-l", "1", "@DEFAULT_AUDIO_SINK@", "5%+"]
locked = true
repeat = true

[[binding]]
id = "volume-down"
title = "Quieter"
group = "Sound and light"
target = "Speakers"
keys = "VolumeDown"
run = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "5%-"]
locked = true
repeat = true

[[binding]]
id = "mute"
title = "Mute"
group = "Sound and light"
target = "Speakers"
keys = "Mute"
run = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SINK@", "toggle"]
locked = true

[[binding]]
id = "mic-mute"
title = "Mute the microphone"
group = "Sound and light"
target = "Microphone"
keys = "MicMute"
run = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SOURCE@", "toggle"]
locked = true

[[binding]]
id = "brightness-up"
title = "Brighter"
group = "Sound and light"
target = "Screen"
keys = "BrightnessUp"
run = ["qs", "-c", "{id}", "ipc", "call", "osd", "brightness", "5%+"]
locked = true
repeat = true

[[binding]]
id = "brightness-down"
title = "Darker"
group = "Sound and light"
target = "Screen"
keys = "BrightnessDown"
run = ["qs", "-c", "{id}", "ipc", "call", "osd", "brightness", "5%-"]
locked = true
repeat = true

[[binding]]
id = "play"
title = "Play or pause"
group = "Sound and light"
target = "Music and video"
keys = "Play"
run = ["playerctl", "play-pause"]
locked = true

[[binding]]
id = "next-track"
title = "Next track"
group = "Sound and light"
target = "Music and video"
keys = "Next"
run = ["playerctl", "next"]
locked = true

[[binding]]
id = "previous-track"
title = "Previous track"
group = "Sound and light"
target = "Music and video"
keys = "Previous"
run = ["playerctl", "previous"]
locked = true
