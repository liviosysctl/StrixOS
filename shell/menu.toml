run = ["qs", "-c", "{id}", "ipc", "call", "theme", "set", "mars"]

[[action]]
id = "theme-vulcanus"
title = "Vulcanus"
group = "theme"
symbol = "swatch-book"
words = ["god", "wallpaper", "olive", "forge", "smith", "fire"]
run = ["qs", "-c", "{id}", "ipc", "call", "theme", "set", "vulcanus"]

[[action]]
id = "theme-neptunus"
title = "Neptunus"
group = "theme"
symbol = "swatch-book"
words = ["god", "wallpaper", "sea", "water", "blue", "trident"]
run = ["qs", "-c", "{id}", "ipc", "call", "theme", "set", "neptunus"]

[[action]]
id = "theme-pluto"
title = "Pluto"
group = "theme"
symbol = "swatch-book"
words = ["god", "wallpaper", "heather", "plum", "violet", "underworld"]
run = ["qs", "-c", "{id}", "ipc", "call", "theme", "set", "pluto"]

[[action]]
id = "theme-bacchus"
title = "Bacchus"
group = "theme"
symbol = "swatch-book"
words = ["god", "wallpaper", "claret", "wine"]
