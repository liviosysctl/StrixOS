# The system menu: what Search shows with an empty field, and every action it can find.
# Read by the search service (packages/search) through MENU_FILE. Checked by `nix flake check`
# (unique ids, groups that exist, no emoji). Keys are those of the cheat sheet in the design
# system (StrixUI, strix_design::HOTKEYS); the Hyprland bindings will be made from this file.
#
# A group:  id, title, symbol (a Lucide name), words, parent (another group or action)
# An action: id, title, group, symbol, words, keys, run (a command line), terminal (run it in
# the terminal, kept open). An action with entries inside and no run opens inside Search.
#
# `qs -c {id} ipc call <target> <function>` reaches the shell (Quickshell IpcHandler, the config in
# /etc/xdg/quickshell/{id}); those targets come
# with the desktop. `{id}` stands for the distro id from branding.nix (strix).
#
# A binding (at the end): a key that is no action of Search, for windows, workspaces and apps.
# id, title, group and target as on the cheat sheet, keys, and either run (a command line) or
# hypr (a Hyprland Lua dispatcher; `{key}` stands for the key, a list gives one per key).
# `strix-search bindings` makes the Hyprland keybindings from the actions with keys and these;
# see packages/search/src/bindings.rs for the short forms "Super 1–9", "Super Arrows", "Super = -".

[[group]]
id = "apps"
title = "Apps"
symbol = "layout-grid"
words = ["programs", "launcher"]

[[group]]
id = "style"
title = "Style"
symbol = "swatch-book"
words = ["look", "appearance"]

[[group]]
id = "capture"
title = "Capture"
symbol = "scan"
words = ["screenshot", "record"]

[[group]]
id = "clipboard"
title = "Clipboard"
symbol = "clipboard"
words = ["copy", "paste"]

[[group]]
id = "settings"
title = "Settings"
symbol = "sliders-horizontal"
words = ["preferences", "options"]

[[group]]
id = "update"
title = "Update"
symbol = "refresh-cw"
words = ["upgrade", "version"]

[[group]]
id = "system"
title = "System"
symbol = "power"
words = ["session", "power"]

[[group]]
id = "learn"
title = "Learn"
symbol = "book-open"
words = ["help", "keys"]

[[group]]
id = "commands"
title = "Commands"
symbol = "square-terminal"
words = ["terminal", "shell"]

# ------------------------------------------------------------------ Style

[[action]]
id = "theme"
title = "Theme"
group = "style"
symbol = "palette"
words = ["theme", "picker", "look", "colours", "wallpaper", "god"]

[[action]]
id = "theme-picker"
title = "Theme picker"
group = "theme"
symbol = "palette"
words = ["choose", "carousel"]
keys = "Super Ctrl Space"
run = ["qs", "-c", "{id}", "ipc", "call", "theme", "picker"]

[[action]]
id = "keep-theme"
title = "Keep this theme"
group = "theme"
symbol = "lock"
words = ["pin", "stop", "change", "cycle", "rotate", "god"]
keys = "K"
scope = "picker"
run = ["qs", "-c", "{id}", "ipc", "call", "theme", "keep"]

[[action]]
id = "theme-saturnus"
title = "Saturnus"
group = "theme"
symbol = "swatch-book"
words = ["god", "wallpaper", "red", "default", "saturn", "time", "sickle"]
run = ["qs", "-c", "{id}", "ipc", "call", "theme", "set", "saturnus"]

[[action]]
id = "theme-janus"
title = "Janus"
group = "theme"
symbol = "swatch-book"
words = ["god", "wallpaper", "patina", "green", "door"]
run = ["qs", "-c", "{id}", "ipc", "call", "theme", "set", "janus"]

[[action]]
