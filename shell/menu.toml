# The system menu: what Search shows with an empty field, and every action it can find.
# Read by the search service (packages/search) through MENU_FILE. Checked by `nix flake check`
# (unique ids, groups that exist, no emoji). Keys are those of the cheat sheet in the design
# system (StrixUI, strix_design::HOTKEYS); the Hyprland bindings will be made from this file.
#
# A group:  id, title, symbol (a Lucide name), words, parent (another group or action)
# An action: id, title, group, symbol, words, keys, run (a command line), terminal (run it in
# the terminal, kept open). An action with entries inside and no run opens inside Search.
#
# `qs -c {id} ipc call <target> <function>` reaches the shell (Quickshell IpcHandler, the config in
# /etc/xdg/quickshell/{id}); those targets come
# with the desktop. `{id}` stands for the distro id from branding.nix (strix).
#
# A binding (at the end): a key that is no action of Search, for windows, workspaces and apps.
# id, title, group and target as on the cheat sheet, keys, and either run (a command line) or
# hypr (a Hyprland Lua dispatcher; `{key}` stands for the key, a list gives one per key).
# `strix-search bindings` makes the Hyprland keybindings from the actions with keys and these;
# see packages/search/src/bindings.rs for the short forms "Super 1–9", "Super Arrows", "Super = -".

[[group]]
id = "apps"
title = "Apps"
symbol = "layout-grid"
words = ["programs", "launcher"]

[[group]]
id = "capture"
title = "Capture"
symbol = "scan"
words = ["screenshot", "record"]

[[group]]
id = "settings"
title = "Settings"
symbol = "sliders-horizontal"
words = ["preferences", "options"]

[[group]]
id = "update"
title = "Update"
symbol = "refresh-cw"
words = ["upgrade", "version"]

[[group]]
id = "system"
title = "System"
symbol = "power"
words = ["session", "power"]

[[group]]
id = "learn"
title = "Learn"
symbol = "book-open"
words = ["help", "keys"]

[[group]]
id = "commands"
title = "Commands"
symbol = "square-terminal"
words = ["terminal", "shell"]

# ------------------------------------------------------------------ Apps

[[action]]
id = "store"
title = "Store"
group = "apps"
symbol = "download"
words = ["install", "remove", "uninstall", "apps", "programs", "software", "packages", "nixpkgs"]
run = ["qs", "-c", "{id}", "ipc", "call", "store", "open"]

# ------------------------------------------------------------------ Capture

[[action]]
id = "region-screenshot"
title = "Region screenshot"
group = "capture"
symbol = "crop"
words = ["screenshot", "area", "select", "snip"]
keys = "Print"
run = ["{id}-capture", "region"]

[[action]]
id = "screen-screenshot"
title = "Screen screenshot"
group = "capture"
symbol = "monitor"
words = ["screenshot", "full", "display"]
keys = "Ctrl Print"
run = ["{id}-capture", "screen"]

# ------------------------------------------------------------------ Update

[[action]]
id = "check-updates"
title = "Check for updates"
group = "update"
symbol = "refresh-cw"
words = ["upgrade", "new", "version", "update"]
run = ["{id}-update"]
terminal = true

[[action]]
id = "rebuild"
title = "Rebuild the system"
group = "update"
symbol = "hard-drive-download"
words = ["rebuild", "switch", "nixos", "configuration"]
run = ["sudo", "{id}-rebuild", "switch"]
terminal = true

[[action]]
id = "what-changed"
title = "What changed"
group = "update"
symbol = "file"
words = ["release", "notes", "changelog"]
run = ["xdg-open", "https://github.com/liviosysctl/StrixOS/releases"]

# ------------------------------------------------------------------ System

[[action]]
id = "lock"
title = "Lock"
group = "system"
symbol = "lock"
words = ["lock", "screen"]
keys = "Super Escape"
run = ["loginctl", "lock-session"]

[[action]]
id = "log-out"
title = "Log out"
group = "system"
symbol = "log-out"
words = ["sign", "out", "session", "exit"]
run = ["hyprctl", "dispatch", "hl.dsp.exit()"]

[[action]]
id = "suspend"
title = "Suspend"
group = "system"
symbol = "moon"
words = ["sleep", "standby"]
run = ["systemctl", "suspend"]

[[action]]
id = "hibernate"
title = "Hibernate"
group = "system"
symbol = "moon-star"
words = ["sleep", "disk"]
run = ["systemctl", "hibernate"]

[[action]]
id = "restart"
title = "Restart"
group = "system"
symbol = "rotate-cw"
words = ["reboot"]
run = ["systemctl", "reboot"]

[[action]]
id = "shut-down"
title = "Shut down"
group = "system"
symbol = "power"
words = ["power", "off", "poweroff", "halt"]
run = ["systemctl", "poweroff"]

[[action]]
id = "notifications"
title = "Notifications"
group = "system"
symbol = "bell"
words = ["panel", "messages"]
keys = "Super N"
run = ["qs", "-c", "{id}", "ipc", "call", "notifications", "toggle"]

[[action]]
id = "do-not-disturb"
title = "Do not disturb"
group = "system"
symbol = "bell"
words = ["silence", "quiet", "mute", "notifications"]
keys = "Super Shift N"
run = ["qs", "-c", "{id}", "ipc", "call", "notifications", "quiet"]

# ------------------------------------------------------------------ Learn

[[action]]
id = "all-hotkeys"
title = "All hotkeys"
group = "learn"
symbol = "keyboard"
words = ["cheat", "sheet", "shortcuts", "keybindings", "keys"]
keys = "Super K"
run = ["qs", "-c", "{id}", "ipc", "call", "cheatsheet", "toggle"]

[[action]]
id = "manual"
title = "Manual"
group = "learn"
symbol = "book-open"
words = ["help", "documentation", "readme"]
run = ["xdg-open", "https://github.com/liviosysctl/StrixOS"]

# ------------------------------------------------------------------ Keys that are no action

[[binding]]
id = "search"
title = "Search"
group = "Learn"
target = "Apps, actions, settings and commands"
keys = "Super Space"
run = ["qs", "-c", "{id}", "ipc", "call", "search", "toggle"]

[[binding]]
id = "terminal"
title = "Terminal"
group = "Apps"
target = "Ghostty"
keys = "Super Return"
run = ["ghostty"]

[[binding]]
id = "browser"
title = "Browser"
group = "Apps"
target = "Zen"
keys = "Super Shift Return"
run = ["zen-beta"]

[[binding]]
id = "files"
title = "Files"
group = "Apps"
target = "Nautilus"
keys = "Super E"
run = ["nautilus", "--new-window"]

[[binding]]
id = "text-editor"
title = "Editor"
group = "Apps"
target = "Zed"
keys = "Super Shift E"
run = ["zeditor"]

[[binding]]
id = "music"
title = "Music"
group = "Apps"
target = "Music player"
keys = "Super Shift M"
run = ["amberol"]

[[binding]]
id = "close-window"
title = "Close window"
group = "Windows"
target = "Window"
keys = "Super W"
hypr = "hl.dsp.window.close()"

[[binding]]
id = "full-screen"
title = "Full screen"
group = "Windows"
target = "Window"
keys = "Super F"
hypr = "hl.dsp.window.fullscreen()"

[[binding]]
id = "float-or-tile"
title = "Float or tile"
group = "Windows"
target = "Window"
keys = "Super T"
hypr = 'hl.dsp.window.float({ action = "toggle" })'

[[binding]]
id = "move-focus"
title = "Move focus"
group = "Windows"
target = "Window"
keys = "Super Arrows"
hypr = 'hl.dsp.focus({ direction = "{key}" })'

[[binding]]
id = "go-to-workspace"
title = "Go to workspace"
group = "Workspaces"
target = "Workspace"
keys = "Super 1–9"
hypr = "hl.dsp.focus({ workspace = {key} })"

[[binding]]
id = "move-window-there"
title = "Move window there"
group = "Workspaces"
target = "Workspace"
keys = "Super Shift 1–9"
hypr = "hl.dsp.window.move({ workspace = {key} })"

[[binding]]
id = "next-workspace"
title = "Next workspace"
group = "Workspaces"
target = "Workspace"
keys = "Super Tab"
hypr = 'hl.dsp.focus({ workspace = "e+1" })'

[[binding]]
id = "volume-up"
title = "Louder"
group = "Sound and light"
target = "Speakers"
keys = "VolumeUp"
run = ["wpctl", "set-volume", "-l", "1", "@DEFAULT_AUDIO_SINK@", "5%+"]
locked = true
repeat = true

[[binding]]
id = "volume-down"
title = "Quieter"
group = "Sound and light"
target = "Speakers"
keys = "VolumeDown"
run = ["wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "5%-"]
locked = true
repeat = true

[[binding]]
id = "mute"
title = "Mute"
group = "Sound and light"
target = "Speakers"
keys = "Mute"
run = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SINK@", "toggle"]
locked = true

[[binding]]
id = "mic-mute"
title = "Mute the microphone"
group = "Sound and light"
target = "Microphone"
keys = "MicMute"
run = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SOURCE@", "toggle"]
locked = true

[[binding]]
id = "brightness-up"
title = "Brighter"
group = "Sound and light"
target = "Screen"
keys = "BrightnessUp"
run = ["qs", "-c", "{id}", "ipc", "call", "osd", "brightness", "5%+"]
locked = true
repeat = true

[[binding]]
id = "brightness-down"
title = "Darker"
group = "Sound and light"
target = "Screen"
keys = "BrightnessDown"
run = ["qs", "-c", "{id}", "ipc", "call", "osd", "brightness", "5%-"]
locked = true
repeat = true

[[binding]]
id = "play"
title = "Play or pause"
group = "Sound and light"
target = "Music and video"
keys = "Play"
run = ["playerctl", "play-pause"]
locked = true

[[binding]]
id = "next-track"
title = "Next track"
group = "Sound and light"
target = "Music and video"
keys = "Next"
run = ["playerctl", "next"]
locked = true

[[binding]]
id = "previous-track"
title = "Previous track"
group = "Sound and light"
target = "Music and video"
keys = "Previous"
run = ["playerctl", "previous"]
locked = true
