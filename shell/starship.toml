# The prompt of every shell in a terminal (modules/prompt.nix): segments for time, user,
# git and the path, as powerline bars. The colors are the 16 terminal colors, so the bars
# follow the theme like everything else. It needs a Nerd Font, which Ghostty has.

add_newline = true
format = "[░▒▓](color_black2)$os$time[](fg:color_black2 bg:color_green)$hostname$localip[](fg:color_green bg:color_blue2)$username[](fg:color_blue2 bg:color_yellow)$shlvl$sudo[](fg:color_yellow bg:color_red)$git_branch$git_status$package$docker_context[](fg:color_red bg:color_white3)$directory[](fg:color_white3)$line_break$character[ ](fg:color_fg)"
palette = "strix"
right_format = "$status$cmd_duration"

[character]
disabled = false
error_symbol = "[❯](bold fg:color_red)"
success_symbol = "[❯](bold fg:color_green)"
vimcmd_replace_one_symbol = "[▶](bold fg:color_purple)"
vimcmd_replace_symbol = "[▶](bold fg:color_purple)"
vimcmd_symbol = "[❮](bold fg:color_green)"
vimcmd_visual_symbol = "[V](bold fg:color_yellow)"

[cmd_duration]
format = "[  $duration ]($style)"
min_time = 3000
show_milliseconds = false
style = "fg:color_fg"

[directory]
disabled = false
format = "($style)[$read_only]($read_only_style)[ $path ]($style)"
home_symbol = " "
read_only = ""
read_only_style = "fg:color_red bg:color_white3"
style = "fg:color_bg bg:color_white3"
truncate_to_repo = true
truncation_length = 6
truncation_symbol = " /"

[docker_context]
format = "[[ $symbol( $context) ](fg:color_fg bg:color_red)]($style)"
style = "bg:color_red"
symbol = ""

[git_branch]
format = "[[ $symbol $branch ](fg:color_fg bg:color_red)]($style)"
style = "bg:color_red"
symbol = ""
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "[[($all_status$ahead_behind )](fg:color_fg bg:color_red)]($style)"
style = "bg:color_red"

[hostname]
disabled = false
format = "[$ssh_symbol]($style)[ 󰍹  $hostname ]($style)"
ssh_only = true
ssh_symbol = " 󱘖 "
style = "fg:color_bg bg:color_green"

[jobs]
format = "[$symbol]($style)"
number_threshold = 1
style = "fg:cyan bold"
symbol = "⚙ "
symbol_threshold = 1

[line_break]
disabled = false

[localip]
disabled = false
format = "[ 󰩟 $localipv4 ]($style)"
ssh_only = true
style = "fg:color_bg bg:color_green"

[os]
disabled = false
format = "[ $symbol ]($style)"
style = "fg:color_white3 bg:color_black2"

[os.symbols]
# Strix (ID=strix) is not a name starship knows: it says Linux, and gets the NixOS snowflake
Linux = "󱄅"
NixOS = "󱄅"
Unknown = "󱄅"

[package]
format = "[  $version ](fg:color_fg bg:color_red)"

[palettes.strix]
color_fg = "white"
color_bg = "black"
color_red = "red"
color_green = "green"
color_purple = "purple"
color_yellow = "yellow"
color_orange = "yellow"
color_white1 = "bright-white"
color_white2 = "white"
color_white3 = "white"
color_black1 = "black"
color_black2 = "bright-black"
color_black3 = "bright-black"
color_black4 = "bright-black"
color_blue1 = "blue"
color_blue2 = "blue"
color_blue3 = "cyan"
color_blue4 = "cyan"

[shlvl]
disabled = false
format = "[ $symbol $shlvl ]($style)"
style = "fg:color_bg bg:color_yellow"
symbol = ""
threshold = 2

[status]
disabled = false
format = "[$symbol$status ]($style)"
signal_symbol = "✘ "
style = "fg:yellow"
symbol = "✘ "

[sudo]
disabled = false
format = "[ $symbol ]($style)"
style = "fg:color_red bg:color_yellow"
symbol = "󰌆 "

[time]
disabled = false
format = "[[   $time ](fg:color_white3 bg:color_black2)]($style)"
style = "bg:color_black2"
time_format = "%H:%M"

[username]
disabled = false
format = "[  ]($style)[ $user ](fg:color_bg bg:color_blue2)"
show_always = true
style_root = "fg:color_red bg:color_blue2"
style_user = "fg:color_bg bg:color_blue2"
