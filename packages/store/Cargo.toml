[package]
name = "store"
version = "0.5.0"
edition = "2024"
description = "The Store: a package index of nixpkgs, search, install and remove through the apps tool"
license = "MIT"
publish = false

# The binary is installed under the distro's name by packages/store/default.nix.
[[bin]]
name = "store"
path = "src/main.rs"

[dependencies]
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
