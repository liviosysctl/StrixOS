[package]
name = "desk"
version = "0.7.0"
edition = "2024"
description = "The commands of the desktop: screenshots and recordings, what happens when nobody is at the machine, the system monitor, default apps, storage, printers and drives that are plugged in"
license = "MIT"
publish = false

# One program under several names, <id>-capture, <id>-idle, <id>-monitor, <id>-defaults,
# <id>-storage, <id>-printers and <id>-automount: the name it is started by says which command
# it is and what the distribution is called (packages/desk/default.nix).
[[bin]]
name = "desk"
path = "src/main.rs"

[dependencies]
dbus = "0.9"
libc = "0.2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
